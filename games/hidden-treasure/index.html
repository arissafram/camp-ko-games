<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Treasure</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main class="game">

    <p class="instructions">Can you find the gold??</p>

    <div class="hiding-spots">
      <button class="spot spot-cow" data-type="cow">🐄</button>
      <button class="spot spot-color" data-type="color">🎨</button>
      <button class="spot spot-wiggle" data-type="wiggle">🫨</button>
      <button class="spot spot-grow" data-type="grow">🎈</button>
      <button class="spot spot-flip" data-type="flip">🃏</button>
      <button class="spot spot-blank" data-type="blank">❔</button>
    </div>

    <p id="message"></p>

    <button id="play-again">Reset</button>

  </main>

  <script src="script.js"></script>

</body>
</html>
