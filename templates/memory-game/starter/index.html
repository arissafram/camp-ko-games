<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="game-wrap">
    <h1>Memory</h1>

    <div class="hud">
      <div class="hud-item">
        <span class="hud-value" id="pairs">0 / 8</span>
        <span class="hud-label">pairs</span>
      </div>
      <div class="hud-item">
        <span class="hud-value" id="moves">0</span>
        <span class="hud-label">moves</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div id="win-screen" style="display:none">
      <h2>You matched them all!</h2>
      <p id="win-moves"></p>
      <button class="btn" id="play-again-btn">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
