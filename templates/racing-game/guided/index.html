<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Racing Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="game-wrap">
    <h1>Racing</h1>
    <p class="subtitle">2 players — same keyboard</p>

    <div class="players">

      <div class="player" id="player1-panel">
        <div class="player-label">
          <span class="key-badge">Q</span>
          Player 1
        </div>
        <div class="track">
          <div class="bar" id="bar1"></div>
        </div>
        <div class="pct" id="pct1">0%</div>
      </div>

      <div class="player" id="player2-panel">
        <div class="player-label">
          Player 2
          <span class="key-badge">P</span>
        </div>
        <div class="track">
          <div class="bar" id="bar2"></div>
        </div>
        <div class="pct" id="pct2">0%</div>
      </div>

    </div>

    <div id="win-banner" style="display:none">
      <p id="winner-text">Player 1 wins!</p>
      <button class="btn" id="reset-btn">Play again</button>
    </div>

    <div id="start-hint">
      <p>Press <strong>Q</strong> or <strong>P</strong> to start</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
