<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Your Title Here]</title>
  <link rel="icon" type="image/png" href="../../web-app/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>[Your Title Here]</h1>
  <p>[Instructions: pick rock, paper, or scissors!]</p>

  <div class="choices">
    <button id="rockButton">✊</button>
    <button id="paperButton">📄</button>
    <button id="scissorsButton">✂️</button>
  </div>

  <div class="plays">
    <div>
      <p class="play-label">You</p>
      <p id="playerDisplay">—</p>
    </div>
    <div>
      <p class="play-label">BOT</p>
      <p id="computerDisplay">—</p>
    </div>
  </div>

  <p id="result"></p>

  <script src="script.js"></script>
</body>
</html>
